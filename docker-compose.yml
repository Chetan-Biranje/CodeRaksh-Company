services:
  automation-hub:
    build: .
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health')); raise SystemExit(0 if data['valid'] else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
