version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coderaksh-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coderaksh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CodeRaksh_SecurePass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-coderaksh_n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-coderaksh} -d ${POSTGRES_DB:-coderaksh_n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: coderaksh-ai-enterprise
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-coderaksh_n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-coderaksh}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-CodeRaksh_SecurePass_2026}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/files:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
