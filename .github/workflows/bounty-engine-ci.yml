name: Bounty engine CI
# Tests for engines/bug-bounty-intelligence. Runs in mock mode only: CI has no Tapline credentials.
on:
  push:
    branches: [main]
    paths: ["engines/bug-bounty-intelligence/**", ".github/workflows/bounty-engine-*.yml"]
  pull_request:
    paths: ["engines/bug-bounty-intelligence/**", ".github/workflows/bounty-engine-*.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: engines/bug-bounty-intelligence
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=coderaksh --cov-report=term-missing --cov-fail-under=80
        env:
          CODERAKSH_MODE: mock
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - run: docker build -t coderaksh:ci .
      - name: Run the container in mock mode and check it
        run: |
          docker run -d --name cr -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e CODERAKSH_API_TOKEN="$(openssl rand -hex 24)" coderaksh:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/programs)" = "401"
          test "$(docker exec cr id -u)" = "10001"
