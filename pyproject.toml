[project]
name = "coderaksh-automation-hub"
version = "2.0.0"
description = "Advanced secure catalog, validator, and operations API for n8n automation blueprints"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3"]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/Chetan-Biranje/CodeRaksh-Company"
Repository = "https://github.com/Chetan-Biranje/CodeRaksh-Company.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
